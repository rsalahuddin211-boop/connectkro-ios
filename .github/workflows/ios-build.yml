name: iOS Build (no Apple account)
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_ORIGIN: https://api.connectkro.com
      APP_NAME: ConnectKro
      BUNDLE_ID: com.makaanzasaad.qrproject
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean

      - name: Write patch script
        run: |
          cat > $RUNNER_TEMP/patch.sh <<'EOF'
          #!/bin/bash
          APP="$1"; PROD="$2"; SLICE="$3"
          BIN="$APP/$(basename "$APP" .app)"
          mkdir -p "$APP/Frameworks"
          echo "Frameworks before:"; ls "$APP/Frameworks"
          for name in $(otool -L "$BIN" | grep -o '@rpath/[^/]*\.framework' | sed 's#@rpath/##' | sort -u); do
            if [ -d "$APP/Frameworks/$name" ]; then echo "ok $name"; continue; fi
            src=$(find "$PROD" -type d -name "$name" -path "*XCFrameworkIntermediates*" | head -1)
            if [ -z "$src" ]; then src=$(find ios -type d -path "*/$SLICE/$name" | head -1); fi
            if [ -n "$src" ]; then echo "copy $name from $src"; cp -R "$src" "$APP/Frameworks/"; else echo "NOT FOUND $name"; fi
          done
          echo "Frameworks after:"; ls "$APP/Frameworks"
          EOF
          chmod +x $RUNNER_TEMP/patch.sh

      - name: Simulator build
        run: |
          xcodebuild -workspace ios/$APP_NAME.xcworkspace -scheme $APP_NAME -configuration Release -sdk iphonesimulator -derivedDataPath build-sim ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee build-sim.log | tail -n 40

      - name: Patch simulator app
        run: |
          APP=build-sim/Build/Products/Release-iphonesimulator/$APP_NAME.app
          $RUNNER_TEMP/patch.sh "$APP" build-sim/Build/Products/Release-iphonesimulator ios-arm64_x86_64-simulator 2>&1 | tee patch-log.txt
          ls -la "$APP" > debug-info.txt

      - name: Smoke test (crash log)
        continue-on-error: true
        run: |
          APP=build-sim/Build/Products/Release-iphonesimulator/$APP_NAME.app
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot $DEVICE
          xcrun simctl bootstatus $DEVICE -b
          xcrun simctl install $DEVICE $APP
          (xcrun simctl launch --console $DEVICE $BUNDLE_ID > launch.log 2>&1 &)
          sleep 30
          xcrun simctl io $DEVICE screenshot shot.png || true
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/*$APP_NAME* crash-reports/ 2>/dev/null || true

      - name: Zip simulator app
        run: |
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -r $GITHUB_WORKSPACE/app/$APP_NAME-simulator.zip $APP_NAME.app

      - name: Unsigned IPA
        run: |
          xcodebuild -workspace ios/$APP_NAME.xcworkspace -scheme $APP_NAME -configuration Release -sdk iphoneos -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee build-device.log | tail -n 40
          APP=build-device/Build/Products/Release-iphoneos/$APP_NAME.app
          $RUNNER_TEMP/patch.sh "$APP" build-device/Build/Products/Release-iphoneos ios-arm64 2>&1 | tee -a patch-log.txt
          mkdir Payload
          cp -r $APP Payload/
          zip -r $APP_NAME-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            app/ConnectKro-simulator.zip
            app/ConnectKro-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-logs
          path: |
            app/launch.log
            app/shot.png
            app/debug-info.txt
            app/patch-log.txt
            app/build-sim.log
            app/build-device.log
            app/crash-reports
