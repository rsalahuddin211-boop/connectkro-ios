name: iOS Build (no Apple account)
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_ORIGIN: https://api.connectkro.com
      APP_NAME: ConnectKro
      BUNDLE_ID: com.makaanzasaad.qrproject
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean

      - name: Simulator build
        run: |
          xcodebuild -workspace ios/$APP_NAME.xcworkspace -scheme $APP_NAME -configuration Release -sdk iphonesimulator -derivedDataPath build-sim ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | tail -n 40
          cd build-sim/Build/Products/Release-iphonesimulator
          zip -r $GITHUB_WORKSPACE/app/$APP_NAME-simulator.zip $APP_NAME.app

      - name: Smoke test (crash log)
        continue-on-error: true
        run: |
          APP=build-sim/Build/Products/Release-iphonesimulator/$APP_NAME.app
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          echo "Device: $DEVICE" > debug-info.txt
          lipo -info $APP/$APP_NAME >> debug-info.txt 2>&1 || true
          xcrun simctl boot $DEVICE
          xcrun simctl bootstatus $DEVICE -b
          xcrun simctl install $DEVICE $APP
          (xcrun simctl launch --console $DEVICE $BUNDLE_ID > launch.log 2>&1 &)
          sleep 30
          xcrun simctl io $DEVICE screenshot shot.png || true
          xcrun simctl spawn $DEVICE log show --last 2m --style compact --predicate "process == \"$APP_NAME\"" > syslog.txt 2>&1 || true
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/*$APP_NAME* crash-reports/ 2>/dev/null || true

      - name: Unsigned IPA
        run: |
          xcodebuild -workspace ios/$APP_NAME.xcworkspace -scheme $APP_NAME -configuration Release -sdk iphoneos -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO | tail -n 40
          mkdir Payload
          cp -r build-device/Build/Products/Release-iphoneos/$APP_NAME.app Payload/
          zip -r $APP_NAME-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-builds
          path: |
            app/ConnectKro-simulator.zip
            app/ConnectKro-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-logs
          path: |
            app/launch.log
            app/syslog.txt
            app/shot.png
            app/debug-info.txt
            app/crash-reports
